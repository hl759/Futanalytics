name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Testes (pytest)
        id: pytest
        run: pytest -q --tb=short > /tmp/pytest.log 2>&1
        continue-on-error: true
      - name: Diagnóstico da falha (comentário na PR)
        if: steps.pytest.outcome != 'success' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo 'Falha nos testes. Saída (trecho):'; echo '```'; tail -c 5000 /tmp/pytest.log; echo '```'; } > /tmp/body.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/body.md || true
      - name: Falhar se os testes falharam
        if: steps.pytest.outcome != 'success'
        run: exit 1
