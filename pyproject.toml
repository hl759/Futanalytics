[project]
name = "futanalytics"
version = "3.0.0"
description = "Análise de valor, gols e disciplina para apostas de futebol (modelo Poisson + xG + gestão de risco)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data_cache", "app/calibration_data.json"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
  "E501",    # comprimento de linha: tratado pelo formatador
  "RUF001",  # caracteres unicode em strings (pt-BR usa acentos de propósito)
  "RUF002",
  "RUF003",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
